<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Đã lưu · DUNG NGUYEN PROMPTS</title><link rel="stylesheet" href="/assets/site.css"></head><body>
<header class="topbar"><a class="brand" href="/">DUNG NGUYEN <span>PROMPTS</span></a><div class="header-actions"><a class="link-btn" href="/">← Thư viện</a><a class="link-btn" href="/builder.html">✨ Builder</a></div></header>
<main class="wrap"><section class="hero" style="padding-top:30px"><p class="eyebrow">PERSONAL SPACE</p><h1>Prompt <span>Đã lưu</span></h1><p>Danh sách yêu thích và collections được lưu trực tiếp trên thiết bị này.</p></section>
<section class="toolbar"><h2>Yêu thích</h2><span id="count" class="muted-count">0 prompt</span></section><div id="grid" class="grid"></div>
<footer class="footer"><div class="copyright"><strong>DUNG NGUYEN PROMPTS</strong><br>© 2026 DUNG NGUYEN PROMPTS. Bản quyền ứng dụng, giao diện và hệ thống thuộc về chủ sở hữu ứng dụng.</div></footer></main><div id="toast" class="toast"></div>
<script>
const favKey="shareprompt_favorites";const $=s=>document.querySelector(s);const fmt=v=>Number(v||0).toLocaleString("vi-VN");const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");function get(){try{return JSON.parse(localStorage.getItem(favKey)||"[]")}catch{return[]}}function set(v){localStorage.setItem(favKey,JSON.stringify(v))}function toast(m){const t=$("#toast");t.textContent=m;t.className="toast show";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="toast",2200)}async function load(){const ids=get().map(Number);if(!ids.length){$("#count").textContent="0 prompt";$("#grid").innerHTML='<div class="empty" style="grid-column:1/-1">Chưa có prompt nào được lưu trên thiết bị này.</div>';return}try{const r=await fetch("/api/prompts?limit=500",{cache:"no-store"});const d=await r.json();const list=(d.prompts||[]).filter(p=>ids.includes(Number(p.id)));$("#count").textContent=`${list.length} prompt`;$("#grid").innerHTML=list.length?list.map(p=>`<article class="card"><div><span class="badge">${esc(p.category_name||"PROMPT")}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||"")}</p></div><div><div class="meta"><span>👁 ${fmt(p.views)}</span><span>⧉ ${fmt(p.copies)}</span></div><div class="actions"><a class="btn primary" href="/prompt/${encodeURIComponent(p.slug)}">Xem nội dung</a><button class="btn saved" data-remove="${p.id}">★ Bỏ lưu</button></div></div></article>`).join(""):'<div class="empty" style="grid-column:1/-1">Một số prompt đã bị gỡ khỏi thư viện.</div>'}catch{$("#grid").innerHTML='<div class="empty" style="grid-column:1/-1">Không thể tải prompt.</div>'}}$("#grid").addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(!b)return;const v=get().filter(id=>Number(id)!==Number(b.dataset.remove));set(v);toast("Đã bỏ lưu prompt.");load()});load();
</script></body></html>
