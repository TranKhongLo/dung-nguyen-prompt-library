<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b10"><title>Prompt Builder · DUNG NGUYEN</title><link rel="stylesheet" href="/assets/site.css"></head><body>
<header class="topbar"><a class="brand" href="/">DUNG NGUYEN <span>PROMPTS</span></a><div class="header-actions"><a class="link-btn" href="/">← Thư viện</a><a class="link-btn" href="/saved.html">☆ Đã lưu</a></div></header>
<main class="wrap"><section style="padding:25px 0 20px"><p class="eyebrow">PROMPT BUILDER</p><h1 class="page-title">Tạo Prompt <span style="background:linear-gradient(90deg,#fff,#8895ff);-webkit-background-clip:text;background-clip:text;color:transparent">thông minh</span></h1><p class="page-sub">Smart Template Builder hoạt động ngay trên thiết bị, không cần API key.</p></section>
<section class="panel"><div class="form-grid"><div class="field"><label>Chủ đề</label><input id="topic" placeholder="Ví dụ: Người đàn ông ngồi một mình bên cửa sổ lúc hoàng hôn"></div><div class="field"><label>Mục tiêu</label><select id="goal"><option>Tạo ảnh</option><option>Tạo video</option><option>Viết nội dung</option><option>Thumbnail YouTube</option><option>Facebook</option></select></div><div class="field"><label>Phong cách</label><input id="style" value="cinematic, realistic, emotional, detailed"></div><div class="field"><label>Tông cảm xúc</label><input id="tone" value="deep, melancholic, mature"></div><div class="field"><label>Tỷ lệ / format</label><select id="format"><option>9:16</option><option>16:9</option><option>4:5</option><option>1:1</option></select></div><div class="field"><label>Ngôn ngữ</label><select id="language"><option>Vietnamese</option><option>English</option><option>Vietnamese + English</option></select></div><div class="field full"><label>Chi tiết bổ sung</label><textarea id="details" placeholder="Nhân vật, bối cảnh, camera, ánh sáng, thời gian, chuyển động..."></textarea></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px"><button id="build" class="btn primary">✨ Tạo Prompt</button><button id="copy" class="btn" type="button">📋 Sao chép</button><button id="clear" class="btn" type="button">↺ Xóa</button></div></section>
<section class="panel" style="margin-top:15px"><div class="toolbar" style="margin:0 0 8px"><h2>Kết quả</h2><span class="muted-count">Smart Template</span></div><pre id="result" style="white-space:pre-wrap;margin:0;color:#e7ebf3;font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px"></pre></section></main>
<script>const $=s=>document.querySelector(s);function build(){const topic=$("#topic").value.trim();if(!topic){$("#result").textContent="Hãy nhập chủ đề trước.";return}const goal=$("#goal").value,style=$("#style").value.trim(),tone=$("#tone").value.trim(),format=$("#format").value,language=$("#language").value,details=$("#details").value.trim();$("#result").textContent=`You are a professional AI content creator. Create a high-quality ${goal.toLowerCase()} prompt.\n\nSUBJECT:\n${topic}\n\nSTYLE:\n${style}\n\nEMOTIONAL TONE:\n${tone}\n\nFORMAT / ASPECT RATIO:\n${format}\n\nLANGUAGE:\n${language}\n\nADDITIONAL DETAILS:\n${details||"Use the subject naturally and add coherent cinematic details."}\n\nQUALITY REQUIREMENTS:\nClear subject, coherent composition, realistic lighting, rich atmosphere, professional visual language, strong emotional impact, no unnecessary text, no distorted anatomy, no duplicated objects.`}$("#build").addEventListener("click",build);$("#copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("#result").textContent);alert("Đã sao chép prompt.")}catch{}});$("#clear").addEventListener("click",()=>{$("#topic").value="";$("#details").value="";$("#result").textContent=""});</script></body></html>
